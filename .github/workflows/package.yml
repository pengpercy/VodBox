name: Package
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
jobs:
  package:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, rid: win-x64 }
          - { os: windows-11-arm, rid: win-arm64 }
          - { os: macos-15-intel, rid: osx-x64 }
          - { os: macos-15, rid: osx-arm64 }
          - { os: ubuntu-22.04, rid: linux-x64 }
          - { os: ubuntu-22.04-arm, rid: linux-arm64 }
    steps:
      - uses: actions/checkout@v6
      # The binaries may come from this run or from an earlier green run of the same source tree.
      - name: Fetch build artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/meta artifacts/build artifacts/publish/${{ matrix.rid }}
          gh run download ${{ github.run_id }} -n vodbox-meta.${{ matrix.rid }} -D artifacts/meta
          run_id=$(python3 build/ci_reuse.py artifact-run --meta artifacts/meta/${{ matrix.rid }}.json --current-run ${{ github.run_id }})
          echo "binary artifact run: $run_id"
          gh run download "$run_id" -n vodbox.${{ matrix.rid }} -D artifacts/build
          tar -xzf artifacts/build/VodBox.${{ matrix.rid }}.tar.gz -C artifacts/publish/${{ matrix.rid }}
      - name: Linux packaging tools
        if: startsWith(matrix.rid, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-dev build-essential rpm
          sudo gem install fpm --version 1.16.0 --no-document
      - name: Package
        shell: bash
        run: python3 build/package.py ${{ matrix.rid }} artifacts/publish/${{ matrix.rid }} artifacts/packages --version ${{ inputs.version }}
      - uses: actions/upload-artifact@v6
        with:
          name: package.${{ matrix.rid }}
          path: |
            artifacts/packages/*.zip
            artifacts/packages/*.dmg
            artifacts/packages/*.deb
            artifacts/packages/*.rpm
          retention-days: 14
