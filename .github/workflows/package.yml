name: Package
on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      source_sha:
        type: string
        required: true
      source_run:
        description: Use verified outputs and successful packages from this run; empty means this run.
        type: string
        default: ''
jobs:
  sources:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Collect distinct matching source closures from actual build artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGIN_RUN: ${{ inputs.source_run || github.run_id }}
        run: |
          mkdir -p artifacts/sources artifacts/source-meta
          for rid in win-x64 win-arm64 osx-x64 osx-arm64 linux-x64 linux-arm64; do
            gh run download "$ORIGIN_RUN" --repo "$GITHUB_REPOSITORY" -n "vodbox-meta.$rid" -D artifacts/source-meta
            python3 build/package_reuse.py --rid "$rid" --version "${{ inputs.version }}" \
              --source-sha "${{ inputs.source_sha }}" --repo "$GITHUB_REPOSITORY" \
              --source-run "$ORIGIN_RUN" --meta "artifacts/source-meta/$rid.json" \
              --jobs "artifacts/source-meta/jobs.$rid.json"
            producer_sha=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sourceSha"])' "artifacts/source-meta/$rid.json")
            run_id=$(python3 build/ci_reuse.py artifact-run --meta "artifacts/source-meta/$rid.json" --current-run "$ORIGIN_RUN")
            mkdir -p "artifacts/source-input/$rid" "artifacts/source-host/$rid"
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n "vodbox.$rid" -D "artifacts/source-input/$rid"
            tar -xzf "artifacts/source-input/$rid/VodBox.$rid.tar.gz" -C "artifacts/source-host/$rid" \
              JavaHost/corresponding-source JavaHost/native-backend-receipt.json
            python3 build/source_assets.py --host "artifacts/source-host/$rid/JavaHost" \
              --output artifacts/sources --version "${{ inputs.version }}" --source-sha "${{ inputs.source_sha }}" \
              --producer-sha "$producer_sha"
            rm -rf "artifacts/source-input/$rid" "artifacts/source-host/$rid"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: matching-source-assets
          path: artifacts/sources/*
          if-no-files-found: error
          retention-days: 14
  package:
    needs: sources
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, rid: win-x64 }
          - { os: windows-11-arm, rid: win-arm64 }
          - { os: macos-15-intel, rid: osx-x64 }
          - { os: macos-15, rid: osx-arm64 }
          - { os: ubuntu-24.04, rid: linux-x64 }
          - { os: ubuntu-24.04-arm, rid: linux-arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          name: matching-source-assets
          path: artifacts/sources
      - name: Install package evidence readers
        if: startsWith(matrix.rid, 'linux')
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools
          python3 -m pip install rpmfile
      - name: Test packaging reuse guards
        shell: bash
        run: python3 build/test_package_reuse.py
      # Validate metadata and package inputs with the tooling at the requested source SHA.
      - name: Validate native build metadata
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGIN_RUN: ${{ inputs.source_run || github.run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          VERSION: ${{ inputs.version }}
        run: |
          case "$ORIGIN_RUN" in ''|*[!0-9]*) exit 1;; esac
          mkdir -p artifacts/meta
          gh run download "$ORIGIN_RUN" --repo "$GITHUB_REPOSITORY" -n vodbox-meta.${{ matrix.rid }} -D artifacts/meta
          reuse_arg=()
          if [ -n "${{ inputs.source_run }}" ]; then reuse_arg=(--reuse-packages); fi
          python3 build/package_reuse.py --rid ${{ matrix.rid }} --version "$VERSION" --source-sha "$SOURCE_SHA" \
            --repo "$GITHUB_REPOSITORY" --source-run "$ORIGIN_RUN" --meta artifacts/meta/${{ matrix.rid }}.json --jobs artifacts/jobs.json "${reuse_arg[@]}" >> "$GITHUB_OUTPUT"
      - name: Reuse successful package
        if: steps.source.outputs.reuse_package == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.source_run }}" --repo "$GITHUB_REPOSITORY" -n package.${{ matrix.rid }} -D artifacts/packages
          gh run download "${{ inputs.source_run }}" --repo "$GITHUB_REPOSITORY" -n native-backend-receipt.${{ matrix.rid }} -D artifacts/receipts
          gh run download "${{ inputs.source_run }}" --repo "$GITHUB_REPOSITORY" -n package-evidence.${{ matrix.rid }} -D artifacts/package-evidence
      - name: Fetch verified build artifact
        if: steps.source.outputs.reuse_package != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/build artifacts/publish/${{ matrix.rid }}
          origin_run="${{ inputs.source_run || github.run_id }}"
          run_id=$(python3 build/ci_reuse.py artifact-run --meta artifacts/meta/${{ matrix.rid }}.json --current-run "$origin_run")
          echo "binary artifact run: $run_id"
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" -n vodbox.${{ matrix.rid }} -D artifacts/build
          tar -xzf artifacts/build/VodBox.${{ matrix.rid }}.tar.gz -C artifacts/publish/${{ matrix.rid }}
      - name: Linux packaging tools
        if: steps.source.outputs.reuse_package != 'true' && startsWith(matrix.rid, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y ruby-dev build-essential rpm
          sudo gem install fpm --version 1.16.0 --no-document
      - name: Separate matching source from the runtime payload
        if: steps.source.outputs.reuse_package != 'true'
        shell: bash
        run: |
          producer_sha=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sourceSha"])' "artifacts/meta/${{ matrix.rid }}.json")
          python3 build/source_assets.py --host artifacts/publish/${{ matrix.rid }}/JavaHost \
            --existing --output artifacts/sources --version "${{ inputs.version }}" --source-sha "${{ inputs.source_sha }}" \
            --producer-sha "$producer_sha"
      - name: Package
        if: steps.source.outputs.reuse_package != 'true'
        shell: bash
        run: python3 build/package.py ${{ matrix.rid }} artifacts/publish/${{ matrix.rid }} artifacts/packages --version ${{ inputs.version }}
      - name: Record packaging provenance
        shell: bash
        env:
          REUSED: ${{ steps.source.outputs.reuse_package }}
          TOOL_SHA: ${{ github.workflow_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('artifacts/meta/${{ matrix.rid }}.json')
          meta = json.loads(p.read_text())
          original = json.loads(Path('artifacts/jobs.json').read_text())
          meta['packageSourceSha'] = os.environ['SOURCE_SHA']
          meta['packagingWorkflowSha'] = original['head_sha'] if os.environ['REUSED'] == 'true' else os.environ['TOOL_SHA']
          meta['packageReused'] = os.environ['REUSED'] == 'true'
          p.write_text(json.dumps(meta, indent=2) + '\n')
          PY
      - uses: actions/upload-artifact@v7
        if: inputs.source_run != ''
        with:
          name: vodbox-meta.${{ matrix.rid }}
          path: artifacts/meta/${{ matrix.rid }}.json
          retention-days: 14
      # The per-RID source-rebuild receipt, published as its own artifact so the release job can
      # verify exactly the receipt that travelled with this package instead of a workspace copy.
      - name: Collect the packaged source-rebuild receipt
        if: steps.source.outputs.reuse_package != 'true'
        shell: bash
        run: |
          receipt=$(find artifacts/publish/${{ matrix.rid }} -name native-backend-receipt.json -print -quit)
          test -n "$receipt"
          mkdir -p artifacts/receipts
          cp "$receipt" artifacts/receipts/native-backend-receipt.${{ matrix.rid }}.json
      - name: Record real package format evidence
        if: steps.source.outputs.reuse_package != 'true'
        shell: bash
        run: |
          python3 build/release_evidence.py --rid ${{ matrix.rid }} \
            --archives artifacts/packages --receipts artifacts/receipts --sources artifacts/sources \
            --meta artifacts/meta --expected-sha "${{ inputs.source_sha }}" --version "${{ inputs.version }}" \
            --write-package-receipts artifacts/package-evidence
      - name: Verify reused package evidence
        if: steps.source.outputs.reuse_package == 'true'
        shell: bash
        run: |
          python3 build/release_evidence.py --rid ${{ matrix.rid }} \
            --archives artifacts/packages --receipts artifacts/receipts --sources artifacts/sources \
            --meta artifacts/meta --expected-sha "${{ inputs.source_sha }}" --version "${{ inputs.version }}" \
            --package-receipts artifacts/package-evidence
      - uses: actions/upload-artifact@v7
        with:
          name: package-evidence.${{ matrix.rid }}
          path: artifacts/package-evidence/*.package-evidence.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: native-backend-receipt.${{ matrix.rid }}
          path: artifacts/receipts/native-backend-receipt.${{ matrix.rid }}.json
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: package.${{ matrix.rid }}
          path: |
            artifacts/packages/*.zip
            artifacts/packages/*.dmg
            artifacts/packages/*.deb
            artifacts/packages/*.rpm
          # Installers are already compressed; recompressing only slows upload.
          compression-level: 0
          retention-days: 14
