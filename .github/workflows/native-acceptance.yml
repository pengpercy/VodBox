name: Native acceptance
# Six-RID native acceptance on demand. This is the manual entry that exercises the full
# build.yml matrix (AOT publish, bundled libmpv/QuickJS and verification on each of the six runners)
# **without** touching release: it packages nothing
# and publishes nothing, so it is safe to run against any branch while the native closure is
# still incomplete. It reuses build.yml, so the two can never drift apart.
#
# The run is evidence, not a publication: build.yml stops after verification and never packages,
# signs or uploads here, so it can be exercised against any branch.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version stamped into the AOT publish; empty uses VERSION at the source commit.
        type: string
        default: ''
      source_sha:
        description: Commit to verify; empty uses the triggering ref.
        type: string
        default: ''
      reuse:
        description: Reuse a successful build of an identical source tree; false forces a real rebuild.
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  resolve:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.value }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      - id: version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          if [ -z "$version" ]; then version=$(cat VERSION); fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  # Reuse the release/build workflow verbatim: all six RIDs, the real native verification steps.
  # No release job consumes this run, so a green result is acceptance evidence, not a publication.
  build:
    needs: resolve
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.resolve.outputs.version }}
      source_sha: ${{ needs.resolve.outputs.sha }}
      reuse_existing: ${{ inputs.reuse }}
      platforms: all
