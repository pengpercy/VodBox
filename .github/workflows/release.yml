name: Release
on:
  push:
    tags: ['v*']
  # Reuse an already-green build: no rebuild is a no-op, it just packages and releases.
  workflow_dispatch:
    inputs:
      version:
        description: Version to release; must equal VERSION at the source commit.
        required: true
      source_sha:
        description: Commit to package and tag.
        required: true
      build_run:
        description: Existing run with successful native builds; retry packaging only and retain successful packages.
        required: false
        default: ''
      package_run:
        description: Existing run with six successful packages; skips building and packaging.
        required: false
        default: ''
permissions:
  contents: write
  actions: read
jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      value: ${{ steps.version.outputs.value }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            sha="${{ inputs.source_sha }}"
            git fetch --depth=1 origin "$sha"
            sha=$(git rev-parse FETCH_HEAD)
            test "$(git show "$sha:VERSION" | tr -d '[:space:]')" = "$version"
          else
            version=$(cat VERSION)
            test "$GITHUB_REF_NAME" = "v$version"
            sha=$(git rev-parse HEAD)
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
  # Declare, before a single package is built, that the repository's own trees describe a
  # distributable product: the binary RID coverage (build/dex-deps.json) and the per-component
  # redistribution obligation (native-source-manifest.json + the retained notices). Neither has a
  # written-in "complete" flag to edit.
  #
  # This runs *before* the source-native rebuild, so it must not demand a rebuild receipt the build
  # has not produced yet: `--allow-unrebuilt-receipts` is the declaration pass, and it is a warning
  # only for a receipt that is *absent*. Every other defect (a missing manifest entry, an
  # unclassified native, an unretained notice, a receipt that exists but records no output hash, or
  # a classes-only exclusion offered as a source proof) still stops the run here. This pass never
  # publishes; the actual evidence is re-derived from the downloaded packages below.
  preflight:
    if: always() && needs.version.result == 'success'
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
      - name: Declare the native/source obligation state before the build
        shell: bash
        run: python3 build/release_preflight.py --skip-permissions --allow-unrebuilt-receipts
  build:
    if: needs.preflight.result == 'success' && inputs.package_run == '' && inputs.build_run == ''
    needs: [version, preflight]
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.value }}
      source_sha: ${{ needs.version.outputs.sha }}
  package:
    if: always() && inputs.package_run == '' && needs.version.result == 'success' && needs.preflight.result == 'success' && (needs.build.result == 'success' || inputs.build_run != '')
    needs: [version, preflight, build]
    uses: ./.github/workflows/package.yml
    with:
      version: ${{ needs.version.outputs.value }}
      source_sha: ${{ needs.version.outputs.sha }}
      source_run: ${{ inputs.build_run }}
  release:
    if: always() && needs.version.result == 'success' && needs.preflight.result == 'success' && (needs.package.result == 'success' || inputs.package_run != '')
    needs: [version, preflight, package]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install package evidence readers
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools
          python3 -m pip install rpmfile
      # Fail fast on a token that cannot publish, and re-derive the closure verdicts from the
      # repository's own trees. This is a declaration check, not the evidence check: the packages
      # do not exist yet at this point, and a gate that demanded packaging output here would be
      # demanding an artifact no step has produced.
      - name: Declare native closure and publish permissions
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python3 build/release_preflight.py --allow-unrebuilt-receipts
      # The corresponding-source obligation is a separate gate from RID coverage: five of six RIDs
      # having backend natives does not close the source of the distributed binaries. Fail closed
      # and never pass --allow-incomplete here.
      - name: Declare corresponding-source closure
        shell: bash
        run: python3 build/native_coverage.py source-closure
      - name: Verify existing package metadata
        if: inputs.package_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RUN: ${{ inputs.package_run }}
          SOURCE_SHA: ${{ needs.version.outputs.sha }}
          VERSION: ${{ needs.version.outputs.value }}
        shell: bash
        run: |
          case "$PACKAGE_RUN" in ''|*[!0-9]*) exit 1;; esac
          mkdir -p artifacts/meta
          gh run view "$PACKAGE_RUN" --repo "$GITHUB_REPOSITORY" --json jobs > artifacts/jobs.json
          for rid in win-x64 win-arm64 osx-x64 osx-arm64 linux-x64 linux-arm64; do
            gh run download "$PACKAGE_RUN" --repo "$GITHUB_REPOSITORY" -n "vodbox-meta.$rid" -D artifacts/meta
            gh run download "$PACKAGE_RUN" --repo "$GITHUB_REPOSITORY" -n "native-backend-receipt.$rid" -D artifacts/receipts
          done
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          rids = {'win-x64','win-arm64','osx-x64','osx-arm64','linux-x64','linux-arm64'}
          jobs = json.loads(Path('artifacts/jobs.json').read_text())['jobs']
          for rid in rids:
              meta = json.loads((Path('artifacts/meta') / (rid + '.json')).read_text())
              if meta.get('version') != os.environ['VERSION'] or meta.get('packageSourceSha', meta.get('sourceSha')) != os.environ['SOURCE_SHA']:
                  raise SystemExit('Package source/version mismatch: ' + rid)
              if not any(j['conclusion']=='success' and j['name'].startswith('package / ') and j['name'].endswith(', ' + rid + ')') for j in jobs):
                  raise SystemExit('Package job did not succeed: ' + rid)
              if not (Path('artifacts/receipts') / ('native-backend-receipt.' + rid + '.json')).is_file():
                  raise SystemExit('No source-rebuild receipt artifact for: ' + rid)
          PY
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.package_run || github.run_id }}
          pattern: package-evidence.*
          merge-multiple: true
          path: artifacts/package-evidence
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.package_run || github.run_id }}
          pattern: package.*
          merge-multiple: true
          path: artifacts/release
      - uses: actions/download-artifact@v8
        if: inputs.package_run == ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          pattern: vodbox-meta.*
          merge-multiple: true
          path: artifacts/meta
      - uses: actions/download-artifact@v8
        if: inputs.package_run == ''
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.run_id }}
          pattern: native-backend-receipt.*
          merge-multiple: true
          path: artifacts/receipts
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.package_run || github.run_id }}
          name: matching-source-assets
          path: artifacts/sources
      # The evidence check. Every one of the six RIDs must carry its own downloaded archive with a
      # real hash, a staged JavaHost with the RID's actual deps and its packaged
      # native-backend-receipt.json, and the retained license/notice material. A manifest summary, a
      # synthetic receipt, or a job that merely concluded success is not evidence about the bytes.
      - name: Verify the real downloaded packages, per RID
        shell: bash
        run: |
          for rid in win-x64 win-arm64 osx-x64 osx-arm64 linux-x64 linux-arm64; do
            test -f "artifacts/meta/$rid.json"
          done
          python3 build/release_evidence.py \
            --archives artifacts/release --sources artifacts/sources \
            --meta artifacts/meta \
            --receipts artifacts/receipts \
            --package-receipts artifacts/package-evidence \
            --expected-sha "${{ needs.version.outputs.sha }}" \
            --version "${{ needs.version.outputs.value }}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.value }}
          SOURCE_SHA: ${{ needs.version.outputs.sha }}
        shell: bash
        run: python3 build/release_publish.py
