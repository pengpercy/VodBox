name: CI
on:
  # Every branch push builds, so release dispatches reuse a green build of the same tree
  # and platform-specific test failures surface before a release is attempted.
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.alma/**'
      - 'design/**'
  pull_request:
  workflow_dispatch:
    inputs:
      platforms:
        description: Comma-separated RIDs to verify, or all.
        type: string
        default: all
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.platforms || 'all' }}
  cancel-in-progress: true
jobs:
  version:
    # A version-bump commit is always pushed together with its tag, and the tag's Release run builds
    # and tests the same tree on all six RIDs. Building it twice only doubles the macOS runner demand,
    # which queued Release's packaging behind CI for up to 30 minutes.
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Bump version')
    runs-on: ubuntu-22.04
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"
  # Structural gate: catches duplicate YAML keys and reuse guards silently disappearing.
  lint:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Bump version')
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Lint workflows
        shell: bash
        run: |
          python3 -m pip install --quiet pyyaml
          python3 build/ci_lint.py
          python3 -B -m unittest discover -s build -p test_release_publish.py -v
          python3 -B -m unittest discover -s build -p test_release_evidence.py -v
  build:
    needs: [version, lint]
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.value }}
      platforms: ${{ inputs.platforms || 'all' }}
