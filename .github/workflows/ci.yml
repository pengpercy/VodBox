name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.alma/**'
      - 'design/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  version:
    runs-on: ubuntu-22.04
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: echo "value=$(cat VERSION)" >> "$GITHUB_OUTPUT"
  # Structural gate: catches duplicate YAML keys and reuse guards silently disappearing.
  lint:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Lint workflows
        shell: bash
        run: |
          python3 -m pip install --quiet pyyaml
          python3 build/ci_lint.py
  build:
    needs: [version, lint]
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.value }}
