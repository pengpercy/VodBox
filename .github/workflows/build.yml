name: Build
on:
  workflow_call:
    inputs:
      version:
        type: string
        default: '0.2.3'
      source_sha:
        description: Commit to build; empty means the triggering ref.
        type: string
        default: ''
      reuse_existing:
        description: Reuse a successful build of an identical source tree instead of rebuilding.
        type: boolean
        default: true
      platforms:
        description: Comma-separated RIDs to verify, or all.
        type: string
        default: all
jobs:
  select:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - id: select
        env:
          PLATFORMS: ${{ inputs.platforms }}
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          runners = {"win-x64":"windows-2022", "win-arm64":"windows-11-arm",
                     "osx-x64":"macos-15-intel", "osx-arm64":"macos-15",
                     "linux-x64":"ubuntu-24.04", "linux-arm64":"ubuntu-24.04-arm"}
          value = os.environ["PLATFORMS"].strip()
          requested = list(runners) if value == "all" else list(dict.fromkeys(x.strip() for x in value.split(",")))
          if not requested or any(x not in runners for x in requested):
              raise SystemExit("Unknown or empty platform selection")
          print("matrix=" + json.dumps({"include":[{"os":runners[x], "rid":x} for x in requested]}))
          PY
  build:
    needs: select
    name: AOT ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    env:
      GH_TOKEN: ${{ github.token }}
      NUGET_PACKAGES: ${{ github.workspace }}/.packages
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha || github.sha }}
      # Cheap by design: hashes the build inputs and looks for an already-green artifact of the same tree.
      # Any doubt (API error, missing/expired artifact, different version) falls back to a full build.
      - name: Look for a reusable build
        id: reuse
        if: inputs.reuse_existing
        shell: bash
        run: |
          # The helper is taken from the workflow commit, because the commit being built may predate it.
          git fetch --depth=1 origin "${{ github.workflow_sha }}" >/dev/null 2>&1 || true
          mkdir -p artifacts/meta "$RUNNER_TEMP/ci-tools"
          git show "${{ github.workflow_sha }}:build/ci_reuse.py" > "$RUNNER_TEMP/ci-tools/ci_reuse.py"
          python3 "$RUNNER_TEMP/ci-tools/ci_reuse.py" probe --rid ${{ matrix.rid }} --version "${{ inputs.version }}" \
            --repo ${{ github.repository }} --meta artifacts/meta/${{ matrix.rid }}.json >> "$GITHUB_OUTPUT"
      - uses: actions/setup-dotnet@v6
        if: steps.reuse.outputs.skip != 'true'
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v6
        if: steps.reuse.outputs.skip != 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        if: steps.reuse.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Build upstream Java plugin component
        if: steps.reuse.outputs.skip != 'true'
        shell: bash
        run: python3 build/tvbox-host.py
      - name: Install Windows MinGW toolchain
        if: steps.reuse.outputs.skip != 'true' && matrix.rid == 'win-x64'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja
      - name: Resolve Windows MinGW tools
        if: steps.reuse.outputs.skip != 'true' && matrix.rid == 'win-x64'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          gcc --version
          test "$(gcc -dumpmachine)" = x86_64-w64-mingw32
          echo "VODBOX_NATIVE_CC=$(cygpath -m "$(command -v gcc)")" >> "$GITHUB_ENV"
          echo "VODBOX_ENGINE_CMAKE=$(cygpath -m "$(command -v cmake)")" >> "$GITHUB_ENV"
          echo "VODBOX_ENGINE_MAKE=$(cygpath -m "$(command -v ninja)")" >> "$GITHUB_ENV"
          echo "VODBOX_ENGINE_GENERATOR=Ninja" >> "$GITHUB_ENV"
          echo "VODBOX_NATIVE_BASH=$(cygpath -m /usr/bin/bash.exe)" >> "$GITHUB_ENV"
          cygpath -m /mingw64/bin >> "$GITHUB_PATH"
          cygpath -m /usr/bin >> "$GITHUB_PATH"
          printf 'int main(void){return 0;}\n' > "$RUNNER_TEMP/native-probe.c"
          gcc "$RUNNER_TEMP/native-probe.c" -o "$RUNNER_TEMP/native-probe.exe"
          "$RUNNER_TEMP/native-probe.exe"
      - name: Linux native dependencies
        if: steps.reuse.outputs.skip != 'true' && startsWith(matrix.rid, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev libicu-dev libmpv2 libpipewire-0.3-0 libmujs3 libdisplay-info1 liblua5.2-0 patchelf zstd
      - name: Source rebuild of the ARM64 backend for this RID
        if: steps.reuse.outputs.skip != 'true'
        shell: bash
        env:
          # The linked static engine must share the bridge's macOS floor; without this the engine's
          # own CMake default (the runner SDK) raises the shipped library's minimum OS above 11.6.
          VODBOX_ENGINE_CMAKE_FLAGS: ${{ startsWith(matrix.rid, 'osx') && '-DCMAKE_OSX_DEPLOYMENT_TARGET=11.6' || '' }}
        run: |
          python3 build/rebuild_native_backend.py build \
            --rid ${{ matrix.rid }} \
            --deps src/VodBox.PluginHost/JavaHost/deps \
            --engine-cache .cache/native-rebuild-engine
          python3 build/rebuild_native_backend.py verify \
            --receipt src/VodBox.PluginHost/JavaHost/native-backend-receipt.json \
            --deps src/VodBox.PluginHost/JavaHost/deps
      - uses: actions/cache@v6
        if: steps.reuse.outputs.skip != 'true'
        with:
          path: |
            .packages
            .cache/downloads
            .cache/vulkan
            .cache/native-rebuild-engine
          key: nuget-${{ matrix.rid }}-${{ hashFiles('Directory.Packages.props', 'build/native-assets.json', 'third_party/tvbox-silicon/rebuild/backend-unicorn2/engine-pin.json') }}
      - name: Restore and test
        # Managed tests do not depend on CPU architecture; the arm64 legs stay on native verification only.
        if: steps.reuse.outputs.skip != 'true' && !endsWith(matrix.rid, '-arm64')
        shell: bash
        run: |
          python3 build/test_bundle.py
          python3 build/test_nativeverify.py
          python3 build/test_native_coverage.py
          python3 build/test_release_preflight.py
          python3 build/test_package.py
          python3 build/test_archive.py
          python3 build/test_ci_reuse.py
          dotnet restore VodBox.slnx
          # Warnings are errors here so the CI log stays clean and no warning can creep back in.
          dotnet test tests/VodBox.Tests/VodBox.Tests.csproj -c Release --no-restore -p:TreatWarningsAsErrors=true
          dotnet test tests/VodBox.PreviewTests/VodBox.PreviewTests.csproj -c Debug --no-restore -p:TreatWarningsAsErrors=true
      - name: Publish Native AOT
        if: steps.reuse.outputs.skip != 'true'
        shell: bash
        run: |
          dotnet publish src/VodBox.Desktop/VodBox.Desktop.csproj -c Release -r ${{ matrix.rid }} \
            --self-contained -o artifacts/publish/${{ matrix.rid }} \
            -p:Version=${{ inputs.version }} -p:TreatWarningsAsErrors=true
      - name: Bundle pinned libmpv
        if: steps.reuse.outputs.skip != 'true'
        shell: bash
        run: |
          python3 build/bundle.py ${{ matrix.rid }} artifacts/publish/${{ matrix.rid }} \
            --java-host-jar src/VodBox.PluginHost/JavaHost/host.jar
      - name: Verify native backend coverage matches the bundled host
        # The published backend jar carries exactly this RID's source-rebuilt native (all foreign
        # natives were removed by the rebuild), so the check is per-RID, not the five-RID upstream
        # table. bundle.py already fails the bundle on a mismatch; this re-derives it from the
        # published tree so a green log carries the verdict explicitly.
        if: steps.reuse.outputs.skip != 'true'
        shell: bash
        run: |
          python3 build/native_coverage.py verify --deps artifacts/publish/${{ matrix.rid }}/JavaHost/deps --rid ${{ matrix.rid }}
          python3 build/native_coverage.py list
      - name: Verify the packaged source-rebuild receipt travels with the bundle
        if: steps.reuse.outputs.skip != 'true'
        shell: bash
        run: |
          test -f artifacts/publish/${{ matrix.rid }}/JavaHost/native-backend-receipt.json
          python3 build/rebuild_native_backend.py verify \
            --receipt artifacts/publish/${{ matrix.rid }}/JavaHost/native-backend-receipt.json \
            --deps artifacts/publish/${{ matrix.rid }}/JavaHost/deps
      - name: Verify delivered Java runtime and adapter
        if: steps.reuse.outputs.skip != 'true'
        shell: bash
        run: python3 build/verify_java_host.py ${{ matrix.rid }} artifacts/publish/${{ matrix.rid }}/JavaHost
      - name: Verify bundled libmpv decoding
        if: steps.reuse.outputs.skip != 'true'
        shell: bash
        run: python3 build/verify_mpv_bundle.py ${{ matrix.rid }} artifacts/publish/${{ matrix.rid }}
      - uses: actions/cache@v6
        if: steps.reuse.outputs.skip != 'true'
        with:
          path: artifacts/quickjs/${{ matrix.rid }}
          key: quickjs-${{ matrix.rid }}-${{ hashFiles('build/quickjs/CMakeLists.txt', 'build/quickjs/bridge.c', 'build/quickjs/patch_msvc.py') }}
      - name: Build and bundle pinned QuickJS bridge
        if: steps.reuse.outputs.skip != 'true'
        shell: bash
        run: python3 build/quickjs/build.py ${{ matrix.rid }} artifacts/publish/${{ matrix.rid }}
      - name: Verify bundled QuickJS and drpy runtime
        if: steps.reuse.outputs.skip != 'true'
        shell: bash
        run: |
          case "${{ matrix.rid }}" in
            win-*) native=vodbox_quickjs.dll ;;
            osx-*) native=libvodbox_quickjs.dylib ;;
            *) native=libvodbox_quickjs.so ;;
          esac
          export VODBOX_QUICKJS_LIB="$PWD/artifacts/publish/${{ matrix.rid }}/$native"
          dotnet run --project tests/VodBox.QuickJs.Smoke -c Release
          dotnet run --project tests/VodBox.Drpy.Smoke -c Release -- --offline
      - name: Verify NativeAOT script runtime
        if: steps.reuse.outputs.skip != 'true'
        shell: bash
        run: |
          case "${{ matrix.rid }}" in
            win-*) native=vodbox_quickjs.dll; suffix=.exe ;;
            osx-*) native=libvodbox_quickjs.dylib; suffix= ;;
            *) native=libvodbox_quickjs.so; suffix= ;;
          esac
          export VODBOX_QUICKJS_LIB="$PWD/artifacts/publish/${{ matrix.rid }}/$native"
          dotnet publish tests/VodBox.QuickJs.Smoke -c Release -r ${{ matrix.rid }} -p:PublishAot=true -o artifacts/smoke/quickjs
          dotnet publish tests/VodBox.Drpy.Smoke -c Release -r ${{ matrix.rid }} -p:PublishAot=true -o artifacts/smoke/drpy
          "artifacts/smoke/quickjs/VodBox.QuickJs.Smoke$suffix"
          "artifacts/smoke/drpy/VodBox.Drpy.Smoke$suffix" --offline
      - name: Archive build
        if: steps.reuse.outputs.skip != 'true'
        shell: bash
        run: python3 build/archive.py ${{ matrix.rid }} artifacts/publish/${{ matrix.rid }} artifacts/build
      - uses: actions/upload-artifact@v7
        if: steps.reuse.outputs.skip != 'true'
        with:
          name: vodbox.${{ matrix.rid }}
          path: artifacts/build/VodBox.${{ matrix.rid }}.tar.gz
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: steps.reuse.outputs.skip != 'true'
        with:
          name: symbols.${{ matrix.rid }}
          path: artifacts/build/symbols.${{ matrix.rid }}/
          if-no-files-found: ignore
          retention-days: 7
      # Always published: tells the package stage where the real binaries live.
      - name: Finalize build metadata
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/meta "$RUNNER_TEMP/ci-tools"
          git fetch --depth=1 origin "${{ github.workflow_sha }}" >/dev/null 2>&1 || true
          git show "${{ github.workflow_sha }}:build/ci_reuse.py" > "$RUNNER_TEMP/ci-tools/ci_reuse.py"
          python3 "$RUNNER_TEMP/ci-tools/ci_reuse.py" finalize --meta artifacts/meta/${{ matrix.rid }}.json --current-run ${{ github.run_id }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: vodbox-meta.${{ matrix.rid }}
          path: artifacts/meta/${{ matrix.rid }}.json
          retention-days: 7
